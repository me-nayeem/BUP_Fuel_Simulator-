services:
  simulator-api:
    image: asifmahmoud414/bup-fuel-supply-simulator:1.0.0
    environment:
      SIMULATION_SPEED: ${SIMULATION_SPEED:-8}
      TICK_MINUTES: ${TICK_MINUTES:-15}
      SIMULATOR_START_MODE: ${SIMULATOR_START_MODE:-paused} # Options: paused, running
    ports:
      - "8000:8000"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fuel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fuel}
      POSTGRES_DB: ${POSTGRES_DB:-fuel_ops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fuel}:${POSTGRES_PASSWORD:-fuel}@postgres:5432/${POSTGRES_DB:-fuel_ops}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    environment:
      SIMULATOR_BASE_URL: http://simulator-api:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-fuel}:${POSTGRES_PASSWORD:-fuel}@postgres:5432/${POSTGRES_DB:-fuel_ops}
      SIMULATOR_TIMEOUT_MS: ${SIMULATOR_TIMEOUT_MS:-2500}
      SIMULATOR_MAX_RETRIES: ${SIMULATOR_MAX_RETRIES:-2}
      LOOP_POLL_MS: ${LOOP_POLL_MS:-500}
      DEMAND_HISTORY_TICKS: ${DEMAND_HISTORY_TICKS:-32}
      AUTOPILOT_MODE: ${AUTOPILOT_MODE:-ASSISTED}
      ENABLE_SCENARIO_CONTROLS: ${ENABLE_SCENARIO_CONTROLS:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-15000}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      simulator-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
